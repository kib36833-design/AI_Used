name: 部署 GitHub Pages

# 推送到 main 後自動發佈網站，手機瀏覽器直接開網址即可使用
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 設定 Pages（未啟用時自動啟用）
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 上傳網站內容
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
