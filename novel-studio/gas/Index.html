<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小說影視化工坊｜董元創作室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0a08; --panel:#16130f; --panel2:#201b15; --line:#3a3125; --gold:#c9a24a; --gold2:#e8cd83;
  --text:#ede4d0; --mute:#9b8f78; --red:#c55a45; --ink:#0c0a08;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0c0a08;--panel:#16130f;--panel2:#201b15;--line:#3a3125;--gold:#c9a24a;--gold2:#e8cd83;--text:#ede4d0;--mute:#9b8f78;--red:#c55a45;--ink:#0c0a08}}
:root[data-theme="dark"]{--bg:#0c0a08;--panel:#16130f;--panel2:#201b15;--line:#3a3125;--gold:#c9a24a;--gold2:#e8cd83;--text:#ede4d0;--mute:#9b8f78;--red:#c55a45;--ink:#0c0a08}
:root[data-theme="light"]{--bg:#f2ecdf;--panel:#fffaf0;--panel2:#ece2cc;--line:#d6c6a2;--gold:#8a6a1c;--gold2:#6b5114;--text:#221b10;--mute:#6f634c;--red:#a53a2a;--ink:#fffaf0;color-scheme:light}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

/* 片頭 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0;flex:1}
.brand small{color:var(--mute);font-size:12px;letter-spacing:.12em}
.brand b{font-family:var(--serif);font-weight:900;font-size:22px;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b span{color:var(--text);font-weight:500;font-size:15px;margin-left:10px}
.aisel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.aisel select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.aisel[hidden]{display:none}
.sync{font-size:12.5px;color:var(--mute);white-space:nowrap}.sync.ok{color:var(--gold)}.sync.bad{color:var(--red)}
.pcard h3{color:var(--gold2);font-size:17px}
.engnote{background:var(--panel2);border:1px solid var(--gold);border-radius:8px;padding:10px 14px;margin:0 0 6px;font-size:14px}
.engnote b{color:var(--gold2)}
.diff{background:var(--panel2);border:1px solid var(--gold);border-radius:8px;padding:8px 12px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.diff:empty{display:none}
.diff b{color:var(--gold2)}
.diff ul{margin:0;padding-left:18px;flex:1 1 100%}
.fixbox{border-top:1px dashed var(--line);padding-top:12px;margin-top:4px}
.fixrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;font-size:13px;color:var(--mute)}
.ckrow{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:8px}
label.ck{flex-direction:row;align-items:center;gap:5px;font-size:13px;color:var(--text);cursor:pointer}
label.ck input{width:auto;margin:0}
.fixnote{font-size:13px;color:var(--mute);margin:8px 0 0;border-left:3px solid var(--gold);padding-left:8px}
.badge{font-size:12px;border-radius:999px;padding:1px 9px;border:1px solid var(--line);color:var(--mute)}
.badge.ok{border-color:#5f9a63;color:#7fbf83}.badge.fail{border-color:var(--red);color:var(--red)}
.frame.ok{border-color:#5f9a63}.frame.fail{border-color:#c55a45}
.frame i{font-style:normal;color:#e8cd83}
.prog{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:6px 0}
.prog div{height:100%;background:var(--gold)}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.dot{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--mute);font-size:13px}
.dot.on{border-color:var(--gold);color:var(--gold2);border-width:2px}
.dot.ok{background:#2c4a2e;color:#cfe8d0}.dot.fail{background:#5a2620;color:#f3d2cb}
.shootcard{border:1px solid var(--gold);border-radius:12px;background:var(--panel);padding:16px}
.shootcard>header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;margin-bottom:8px}
.shootcard .no{font-family:var(--serif);font-weight:900;font-size:22px;color:var(--gold2)}
.shootdesc{font-family:var(--serif);font-size:15.5px;margin:0 0 14px}
.sblock{margin-bottom:14px}
.sblock .lbl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;color:var(--text);margin-bottom:4px}
.sblock pre{margin:0;white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-family:var(--sans);font-size:13px;max-height:180px;overflow:auto}
.btn.big{padding:10px 18px;font-size:15px}
.btn.okb{border-color:#5f9a63;color:#7fbf83}.btn.okb.on{background:#2c4a2e;color:#e4f3e5}
.btn.warn.on{background:var(--red);color:#fff}
.btn[disabled]{opacity:.4;cursor:default}
.cc{font-size:11.5px;color:var(--mute);margin-left:6px}
.themebtn{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--mute)}

.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 64px)}
.rail{border-right:1px solid var(--line);padding:18px 0;position:sticky;top:64px;align-self:start;height:calc(100vh - 64px)}
.rail button{display:flex;gap:12px;align-items:baseline;width:100%;background:none;border:0;padding:11px 22px;text-align:left;cursor:pointer;color:var(--mute);border-left:3px solid transparent}
.rail button i{font-style:normal;font-family:var(--serif);font-size:13px;color:var(--line);width:22px}
.rail button.on{color:var(--text);border-left-color:var(--gold);background:var(--panel)}
.rail button.on i{color:var(--gold)}
.rail button:hover{color:var(--text)}
.rail .railnote{margin:22px 22px 0;font-size:12px;color:var(--mute);line-height:1.6;border-top:1px solid var(--line);padding-top:14px}

main{padding:26px 32px 80px;max-width:1080px;width:100%;min-width:0}
.aisel>span{white-space:nowrap}
h2{font-family:var(--serif);font-weight:700;font-size:24px;margin:0 0 6px;color:var(--gold2)}
h3{font-family:var(--serif);font-size:18px;margin:0}
.sec{margin-bottom:34px}
.hint{color:var(--mute);font-size:13.5px;margin:4px 0 14px;max-width:70ch}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--text);font-size:14.5px;width:100%}
textarea{resize:vertical;min-height:70px;line-height:1.65}
textarea.src{min-height:320px;font-family:var(--serif);font-size:15.5px;line-height:1.9}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0 20px}
.toolbar label{width:auto}
.toolbar input[type=number]{width:80px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;color:var(--text);font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}
.btn.gold:hover{background:var(--gold2)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.del{color:var(--red)}
.btn.warn{border-color:var(--red);color:var(--red)}
.meta{color:var(--mute);font-size:13px;margin:6px 0 14px}
.empty{border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--mute)}
.empty .btn{margin-top:12px}

/* 集數 */
.eps{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:6px 0 14px}
.chip{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--mute);font-size:13.5px}
.chip.on{border-color:var(--gold);color:var(--gold2)}
.ep{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px 18px;margin-bottom:18px}
.ep>header{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.ep>header .no{font-family:var(--serif);color:var(--gold);font-weight:900;white-space:nowrap}
.beats{list-style:none;margin:10px 0 0;padding:0;counter-reset:b}
.beats li{display:grid;grid-template-columns:34px 70px 1fr 64px 34px;gap:8px;align-items:start;margin-bottom:8px}
.beats li::before{counter-increment:b;content:"P" counter(b,decimal-leading-zero);font-size:12px;color:var(--mute);padding-top:10px}
.beats textarea{min-height:44px}

/* 設定卡 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:8px}
.card .cardhead{display:flex;gap:8px}
.lock{font-size:12px;color:var(--gold)}

/* 膠卷 */
.strip{position:relative;display:flex;gap:6px;overflow-x:auto;background:#050403;padding:18px 10px;border-radius:6px;margin:6px 0 22px;
  background-image:radial-gradient(circle,var(--bg) 3px,transparent 3.5px),radial-gradient(circle,var(--bg) 3px,transparent 3.5px);
  background-size:16px 16px,16px 16px;background-position:4px 3px,4px calc(100% - 3px);background-repeat:repeat-x}
.frame{flex:none;width:118px;height:92px;background:#1b1712;border:1px solid #3a3125;border-radius:3px;padding:6px 7px;color:#d9ccb0;text-decoration:none;font-size:11.5px;line-height:1.4;overflow:hidden;display:flex;flex-direction:column}
.frame b{font-family:var(--serif);color:#e8cd83;font-size:13px}
.frame em{font-style:normal;color:#9b8f78}
.frame:hover{border-color:#c9a24a}
.stripmeta{font-size:13px;color:var(--mute);margin-top:-12px;margin-bottom:18px}

/* 漫畫頁 */
.pagewrap{display:grid;grid-template-columns:200px 1fr;gap:18px;margin-bottom:28px;align-items:start}
.pg{aspect-ratio:3/4;background:#f3eee4;border:6px solid #f3eee4;outline:1px solid var(--line);display:grid;gap:5px;position:sticky;top:84px}
.pg.l1{grid-template:1fr/1fr}
.pg.l2{grid-template:1fr 1fr/1fr}
.pg.l3{grid-template:1.2fr 1fr/1fr 1fr}.pg.l3 .pn:first-child{grid-column:1/3}
.pg.l4{grid-template:1fr 1fr/1fr 1fr}
.pn{background:#fff;border:2px solid #1a1510;padding:4px 6px;font-size:10.5px;line-height:1.35;color:#1a1510;overflow:hidden;text-decoration:none}
.pn b{display:block;font-size:11px}
.pgtitle{font-family:var(--serif);color:var(--gold);margin:0 0 8px;font-size:15px}

/* 鏡頭卡 */
.shot{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px;margin-bottom:16px;scroll-margin-top:84px}
.shot>header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.shot>header .no{font-family:var(--serif);font-weight:900;font-size:17px;color:var(--gold2)}
.shot>header .sp{flex:1}
.shot .tech{font-size:12px;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:1px 9px}
.shot>div,.shot>label{margin-bottom:10px}
.lines{display:flex;flex-direction:column;gap:6px}
.line{display:grid;grid-template-columns:110px 1fr 130px 32px;gap:6px}
.revise{display:flex;gap:8px;border-top:1px dashed var(--line);padding-top:12px;margin-top:4px}
.revise input{flex:1}

/* 提示詞 */
.pr{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px;margin-bottom:14px}
.pr h3{font-size:16px;color:var(--gold2);margin-bottom:8px}
.pbox{position:relative;margin-bottom:10px}
.pbox .lbl{font-size:12px;color:var(--mute);margin-bottom:3px;display:flex;justify-content:space-between;align-items:center}
.pbox pre{margin:0;white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-family:var(--sans);font-size:13.5px;line-height:1.65;max-height:260px;overflow:auto}
details summary{cursor:pointer;color:var(--mute);font-size:13px;margin:4px 0 8px}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tblwrap{overflow-x:auto}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.tbl th{color:var(--mute);font-weight:500;font-size:12.5px}

.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ex{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--panel)}
.ex h3{font-size:16px;color:var(--gold2);margin-bottom:6px}
.ex p{color:var(--mute);font-size:13px;margin:0 0 12px}

/* MV 企劃 */
.tbl.ed td{padding:4px 3px}
.tbl.ed input,.tbl.ed textarea{min-width:92px;padding:6px 8px;font-size:13.5px}
.tbl.ed textarea{min-height:40px}
.tbl.ed td:last-child{width:34px}
.mvsec{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px 18px;margin-bottom:20px}
.mvsec>h3{color:var(--gold2);margin-bottom:10px}
.mvsec h4{font-size:14px;color:var(--text);margin:16px 0 6px;font-weight:700}
.mvsec .lblrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
textarea.lyrics{min-height:360px;font-family:var(--serif);font-size:15px;line-height:1.85}
.tc{font-family:var(--serif);font-size:12.5px;color:var(--gold);white-space:nowrap}
.mvstat{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;margin:6px 0 10px}
.mvstat b{color:var(--gold2);font-family:var(--serif)}
.cardtxt{font-size:13px;color:var(--mute);border-left:3px solid var(--gold);padding-left:8px;margin:0 0 12px}

/* 對話框 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--gold);border-radius:12px;width:min(760px,100%);max-height:100%;overflow:auto;padding:18px 20px}
.mbox>header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.mbox h3{color:var(--gold2)}
.mbox textarea{min-height:150px;font-size:13px}
.stream{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12.5px;max-height:300px;overflow:auto;min-height:60px;color:var(--mute)}
.step{font-family:var(--serif);color:var(--gold);margin:14px 0 6px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:var(--gold);color:var(--ink);padding:8px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .aisel>span{display:none}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:30;display:flex;overflow-x:auto;padding:0 0 env(safe-area-inset-bottom,0px);background:var(--bg);border-right:0;border-top:1px solid var(--line)}
  .rail button{flex:none;width:auto;flex-direction:column;align-items:center;gap:0;padding:8px 13px;border-left:0;border-top:3px solid transparent;font-size:12.5px}
  .rail button.on{border-top-color:var(--gold)}
  .rail button i{width:auto;font-size:11px}
  .rail .railnote{display:none}
  main{padding:18px 14px 110px}
  .top{padding:8px 14px;flex-wrap:wrap;gap:8px}
  .brand{flex:1 1 100%}
  .brand b{font-size:18px}.brand b span{display:none}
  .grid2,.grid3{grid-template-columns:1fr}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .beats li{grid-template-columns:62px 1fr 34px;grid-template-areas:"s t x" ". h h"}
  .beats li::before{display:none}
  .line{grid-template-columns:1fr 1fr 32px}.line input:nth-child(2){grid-column:1/3;grid-row:2}
  .pagewrap{grid-template-columns:1fr}
  .pg{position:static;max-width:220px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><small>董元創作室</small><b id="ttl">小說影視化工坊</b></div>
  <span class="sync" id="sync">連線中…</span>
  <div class="aisel" id="engBox"><span>引擎</span><select id="engSel" aria-label="建議引擎"></select></div>
  <button class="themebtn" id="themeBtn" type="button">亮／暗</button>
</header>
<div class="shell">
  <nav class="rail" id="rail" aria-label="製作流程"></nav>
  <main id="view"></main>
</div>
<div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><header><h3 id="mTitle"></h3><button class="btn sm" data-act="closeModal">關閉</button></header><div id="mBody"></div></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="backupIn" accept=".json" data-file="backup" hidden>

<script>
/* ========== 基本資料 ========== */
const KEY='dy-film-studio-gas';
/* MV 企劃資料：對應「MV 企劃書」七大段 */
function MVDEF(){return {brief:{sec:220,pov:'',note:''},title:'',length:'',genre:'',visual:'',curveSum:'',tagline:'',concept:'',
  layers:[{who:'路人',see:'',feel:''},{who:'讀者',see:'',feel:''}],spoilers:'',curve:[],tears:[],
  song:{bpm:'',key:'',vocal:'',length:'',style:'',exclude:''},arrange:[],lyrics:'',lyricNotes:'',
  bgm:[],silence:'',endCards:[],endLine:'',bookTitle:'',eggs:[]};}
function fixMV(m){const b=MVDEF();m=(m&&typeof m==='object')?m:{};const o={...b,...m,brief:{...b.brief,...(m.brief||{})},song:{...b.song,...(m.song||{})}};
  ['layers','curve','tears','arrange','bgm','endCards','eggs'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=b[k];});return o;}
const DEF=()=>({project:{title:'未命名作品',genre:'謀略',target:'drama',style:'hollywood',aspect:'9:16',imgTool:'mj',platform:'vids',shotDefaults:{angle:'平視',lens:'標準',motion:'常速'}},
  source:{text:''},episodes:[],bible:{characters:[],scenes:[],props:[]},shots:{},audio:{},mv:MVDEF(),ui:{view:'projects',ep:null,engine:'task',project:null}});
const UIKEY=KEY+'-ui',CKEY=KEY+'-cache-';
const HAS_GAS=!!(window.google&&google.script&&google.script.run);
let S=DEF(),CUR={id:null,updated:0},PROJECTS=[],ROOTURL='',LISTSTATE='讀取作品清單中…',LASTJS='',LC=null;
try{const u=JSON.parse(localStorage.getItem(UIKEY)||'null');if(u)S.ui={...S.ui,...u};}catch(e){}
const gs=(fn,...a)=>new Promise((res,rej)=>{if(!HAS_GAS){rej(new Error('nogas'));return;}google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a);});
const dataOf=()=>({project:S.project,source:S.source,episodes:S.episodes,bible:S.bible,shots:S.shots,audio:S.audio,mv:S.mv});

async function flush(force){
  if(!CUR.id)return;
  if(saving){clearTimeout(saveT);saveT=setTimeout(()=>flush(force),1200);return;}
  const js=JSON.stringify(dataOf());
  if(!force&&js===LASTJS){dirty=false;cacheLocal(false);return;}
  if(!dirty&&!force)return;
  saving=true;dirty=false;setSync('','儲存到雲端…');
  try{
    const r=await gs('saveProject',CUR.id,js,S.project.title||'未命名作品',CUR.updated||0,!!force);
    if(r.conflict){saving=false;dirty=true;conflictModal(r);return;}
    CUR.updated=r.updated;LASTJS=js;cacheLocal(false);setSync('ok','已同步 '+hhmm(r.updated));
    const p=PROJECTS.find(x=>x.id===CUR.id);if(p){p.title=S.project.title;p.updated=r.updated;}
  }catch(e){dirty=true;setSync('bad',HAS_GAS?'離線中，已暫存本機':'本機預覽');if(HAS_GAS){clearTimeout(saveT);saveT=setTimeout(()=>flush(),15000);}saving=false;return;}
  saving=false;if(dirty){clearTimeout(saveT);saveT=setTimeout(()=>flush(),1500);}
}

async function openProject(id){

    const r=await gs('loadProject',id);
    if(cache&&cache.pending&&cache.base>=r.updated){applyData(cache.data);CUR={id,updated:r.updated};LASTJS='';dirty=true;flush();}
    else if(cache&&cache.pending){applyData(cache.data);CUR={id,updated:cache.base};LASTJS='';dirty=true;conflictModal({updated:r.updated,remote:r.content});}

function ensureShot(s){const D=shotDef();if(!s.id)s.id=uid();if(!Array.isArray(s.dialogue))s.dialogue=[];if(!Array.isArray(s.chars))s.chars=[];if(!ANGLES.includes(s.angle))s.angle=D.angle;if(!LENSES.includes(s.lens))s.lens=D.lens;if(!MOTIONS.includes(s.motion))s.motion=D.motion;if(s.screenText==null)s.screenText='';

function diffs(s){if(!s.orig)return [];const out=[];TRACK.forEach(([k,l])=>{const a=s.orig[k],b=s[k]??'';if(JSON.stringify(a)===JSON.stringify(b))return;
  if(['visualZh','visualEn','lighting','sfx'].includes(k))out.push({k,l,t:`${l}已增修`,from:a,to:b});
  else if(k==='screenText')out.push({k,l,t:`${l}：${a||'無'} → ${b||'無'}`,from:a,to:b});
  else if(k==='dialogue')out.push({k,l,t:'對白已修改',from:a,to:b});
  else if(k==='chars')out.push({k,l,t:`${l}：${(a||[]).join('、')||'無'} → ${(b||[]).join('、')||'無'}`});
  else out.push({k,l,t:`${l}：${fmtV(k,a)} → ${fmtV(k,b)}`});});return out;}

const PR={
mvPlan:()=>{const m=S.mv,br=m.brief;return `你是華語流行音樂 MV 導演兼作詞人，要替小說《${S.project.title}》（${S.project.genre}）做一支行銷 MV，目的是讓沒讀過的人被打動、讀過的人發現彩蛋。
目標片長：約 ${br.sec||220} 秒；畫面比例 ${S.project.aspect}；畫風：${STYLE[S.project.style].zh}。${br.pov?`\n歌曲視角／主題：${br.pov}`:''}${br.note?`\n作者補充：${br.note}`:''}
規則：
1. 雙層觀看設計：layers 寫「路人」與「讀者」兩種觀眾各自看到什麼（see）、感受到什麼（feel）。
2. 不劇透原則：spoilers 用條列（每行一條，「- 」開頭）寫出不能出現的關鍵反轉線索與替代做法，片尾只拋問題不給答案。
3. 情緒與節奏曲線：curve 依時間切 6～9 段，part 用前奏／主歌一／副歌一／主歌二／橋段／口白／終段副歌／靜默／片尾等名稱，time 用「0:00–0:35」格式並連續到片尾；emotion 情緒、music 音樂層次、tone 畫面調性（色溫、飽和度、鏡位）。建議走「平淡 → 裂縫 → 堆疊 → 高點 → 靜默 → 問句鉤子」。
4. 淚點地圖：tears 列 4～7 個淚點，power 從［輕、中、強、最強、暖收］選，method 寫手法（情緒特寫、關鍵物件、接觸碰撞、廣角全景、縮時、關鍵模糊、替換物件、全曲靜音只留一句等）。
5. 歌曲：song 寫 bpm、key（調性，終段副歌可升半音）、vocal（主唱聲部與唱法）、length（MV 版／單曲版長度）；arrange 寫漸進式編曲，每段加一層樂器；song.style 是貼進 Suno「Style of Music」的英文提示詞（200 字元內）；song.exclude 是 Suno「Exclude Styles」英文。
6. 歌詞 lyrics：可直接貼進 Suno 的 Lyrics 欄，用 [Intro]、[Verse 1]、[Chorus 1]、[Verse 2]、[Bridge]、[Spoken]、[Final Chorus]、[Outro] 等標籤，標籤後加「（0:35–1:10｜說明）」；用小說裡的具體物件與畫面寫詞，不要空泛。若用方言，句後換行加括號中文意思。副歌一與終段副歌只改一兩個字，讓意思翻轉。lyricNotes 條列設計重點。
7. BGM：bgm 至少兩首——純音樂版（用途、design 寫編曲差異、prompt 為 Suno 英文提示詞，結尾加 no vocals）與片尾 cue（design 用「時間｜設計」逐行寫節拍與驟停點）；silence 寫高潮後靜默段的音效順序。

function segs(s){const P=plat(),m=P.max,ls=s.dialogue.filter(d=>d.line);

  const pre=[g.part==='B'?'Continue seamlessly from the previous clip: same characters, wardrobe, lighting and camera position (use Extend).':'',
    ing?'Use the uploaded reference images to keep the characters and setting consistent.':'',fr?'Animate smoothly from the provided start frame to the end frame.':''].filter(Boolean).join(' ');
  ensureShot(s);const omniText=S.project.platform==='omni'&&String(s.screenText||'').trim();

    `Style: ${mv?'music video, ':''}${st.en}, aspect ratio ${S.project.aspect}, no subtitles${omniText?'':', no on-screen text'}, consistent character appearance.`].filter(Boolean).join('\n');
  const zh=[`【${g.d}秒｜${s.size}｜${s.camera}｜${s.angle}｜${LENS_ZH[s.lens]}｜${s.motion}${g.part?'｜段'+g.part:''}】`,g.part==='B'?'延續上一段（用延伸功能接上）。':'',ing?'使用上傳的參考圖保持角色與場景一致。':'',fr?'從首幀平順過渡到尾幀。':'',

${comic?'<span></span>':`<label>動態速度<select data-b="${base}.motion" data-rr>${opts2(MOTIONS.map(a=>[a,a+'（'+MOTION_EN[a]+'）']),s.motion)}</select></label>`}</div>
<div class="grid3"><label>場景<select data-b="${base}.scene" data-rr><option value="">（未指定）</option>${opts(scs,s.scene)}</select></label>
<label>出場角色（用頓號分隔）<input data-b="${base}.chars" data-list value="${esc(s.chars.join('、'))}"></label>
${comic?'<span></span>':`<label>生成方式<select data-b="${base}.method" data-rr>${opts2(Object.entries(METHOD),s.method)}</select></label>`}</div>
<label>畫面描述（中）<textarea data-b="${base}.visualZh">${esc(s.visualZh)}</textarea></label>
<label>畫面描述（英）<textarea data-b="${base}.visualEn">${esc(s.visualEn)}</textarea></label>
${!comic&&s.method==='frames'?`<div class="grid2"><label>尾幀畫面（中）<textarea data-b="${base}.endZh">${esc(s.endZh)}</textarea></label><label>尾幀畫面（英）<textarea data-b="${base}.endEn">${esc(s.endEn)}</textarea></label></div>`:''}
${comic?'':mv?`<label>畫面文字／字卡${S.project.platform==='omni'?'<span class="cc">Omni 會直接渲染進畫面</span>':'<span class="cc">列入字卡清單，剪輯時後製</span>'}<input data-b="${base}.screenText" value="${esc(s.screenText)}" placeholder="例如：【第四十七趟　乘客：陳語彤】、片尾問句"></label>`:`<label>畫面指定文字（限 Omni）${S.project.platform==='omni'?'':'<span class="cc">目前出片平台不是 Omni，這欄不會寫進提示詞</span>'}<input data-b="${base}.screenText" value="${esc(s.screenText)}" placeholder="例如：沈氏宗祠、密電一封、民國二十六年"></label>`}
<div class="grid2"><label>光影氛圍（英）<input data-b="${base}.lighting" value="${esc(s.lighting)}"></label>
<label>音效${comic?'／狀聲詞':''}<span style="display:flex;gap:6px"><input data-b="${base}.sfx" value="${esc(s.sfx)}" aria-label="音效">${comic?`<input data-b="${base}.onomatopoeia" value="${esc(s.onomatopoeia)}" placeholder="砰！" aria-label="狀聲詞" style="width:90px">`:''}</span></label></div>
<div><div class="row" style="margin:0 0 6px;justify-content:space-between"><span style="font-size:13px;color:var(--mute)">${mv?'歌詞／對白（歌詞行的角色寫「主唱（女聲）」，不會做對嘴）':'對白'}</span><button class="btn sm" data-act="addLine" data-i="${i}">＋ 新增一句</button></div>
<div class="lines">${s.dialogue.map((d,j)=>`<div class="line"><input data-b="${base}.dialogue.${j}.who" value="${esc(d.who)}" placeholder="角色" aria-label="角色"><input data-b="${base}.dialogue.${j}.line" value="${esc(d.line)}" placeholder="台詞" aria-label="台詞"><input data-b="${base}.dialogue.${j}.tone" value="${esc(d.tone)}" placeholder="語氣" aria-label="語氣"><button class="btn sm del" data-act="delLine" data-i="${i}" data-j="${j}" aria-label="刪除">×</button></div>`).join('')}</div></div>
${fixPanel(s,i)}</article>`;}
R.board=()=>{if(!S.episodes.length)return `<h2>分鏡</h2>${noEp()}`;
const ep=curEp(),idx=S.episodes.indexOf(ep),comic=S.project.target==='comic',mv=isMV();
const shots=sortShots(S.shots[ep.id]||[]);S.shots[ep.id]=shots;shots.forEach(ensureShot);const T=mv?mvTimes():null;
let body='';
if(!shots.length)body=`<div class="empty">第${idx+1}${unit()}還沒有分鏡。按「AI 生成本${unit()}分鏡」，或手動新增。</div>`;
else if(comic){const pages=[...new Set(shots.map(s=>s.page))];
  body=pages.map(p=>{const ps=shots.map((s,i)=>({s,i})).filter(o=>o.s.page===p);const n=Math.min(4,Math.max(ps.length,1));
  return `<div class="pagewrap"><div><p class="pgtitle">第 ${p} 頁・${ps.length} 格</p><div class="pg l${n}">${ps.slice(0,4).map(o=>`<a class="pn" href="#shot-${o.i}"><b>${o.s.panel}｜${o.s.size}</b>${esc(o.s.visualZh.slice(0,34))}${o.s.dialogue.length?`<br>💬${o.s.dialogue.length}`:''}</a>`).join('')}</div></div><div>${ps.map(o=>shotCard(o.s,o.i,ep)).join('')}</div></div>`;}).join('');}
else{const tot=shots.reduce((a,s)=>a+s.duration,0);
  body=`<div class="strip" aria-label="鏡頭總覽">${shots.map((s,i)=>`<a class="frame ${s.status||''}" href="#shot-${i}"><b>${String(i+1).padStart(2,'0')}${s.status==='ok'?' ✓':s.status==='fail'?' ✗':''}</b><em>${mv?tcOf(s,T):`${s.size}・${s.duration}s`}${s.duration>plat().max?' <i>拆2段</i>':''}</em>${esc(s.visualZh.slice(0,26))}</a>`).join('')}</div>
  <p class="stripmeta">${mv?`本段 ${shots.length} 鏡，${fmtT(mvSegStart(idx))}–${fmtT(mvSegStart(idx)+tot)}（${tot} 秒）；全片 ${fmtT(T._total)}${S.mv.brief.sec?`，目標 ${fmtT(+S.mv.brief.sec)}`:''}`:`共 ${shots.length} 個鏡頭，總長約 ${Math.floor(tot/60)} 分 ${tot%60} 秒`}</p>${shots.map((s,i)=>shotCard(s,i,ep,T)).join('')}`;}
return `<h2>分鏡</h2><p class="hint">${comic?'漫畫模式：每頁 1～4 格，左邊是頁面版型預覽，點格子跳到該格設定。':mv?`MV 模式：膠卷上顯示每鏡的時間碼（依段落順序與時長自動累計）。歌詞寫在「歌詞／對白」並把角色標成「主唱（女聲）」，字卡寫在「畫面文字／字卡」。出片平台 ${plat().zh}，單段上限 ${plat().max} 秒，超過會自動拆兩段。`:`短劇模式：出片平台 ${plat().zh}，每鏡最長 ${plat().max} 秒。上方膠卷是整集鏡頭總覽，點一格跳到該鏡；改了鏡頭設定，卡片上方會列出修改處，可一鍵產生重寫指令。`}產出類型可在「匯入小說」切換。</p>
${epPicker()}<div class="toolbar"><button class="btn gold" data-act="aiBoard">AI 生成本${unit()}分鏡</button><button class="btn" data-act="addShot">＋ 新增${comic?'一格':'鏡頭'}</button>${shots.length?`<button class="btn" data-act="go" data-v="prompts">看提示詞</button>${comic?'':'<button class="btn" data-act="go" data-v="shoot">進入出片模式</button>'}`:''}</div>${body}`;};

function pbox(id,label,text){return `<div class="pbox"><div class="lbl"><span>${label}<span class="cc">${String(text).length} 字元</span></span><button class="btn sm" data-act="copyEl" data-t="${id}">複製</button></div><pre id="${id}">${esc(text)}</pre></div>`;}
R.prompts=()=>{if(!S.episodes.length)return `<h2>提示詞</h2>${noEp()}`;
const ep=curEp(),shots=sortShots(S.shots[ep.id]||[]),comic=S.project.target==='comic';
return `<h2>提示詞</h2><p class="hint">${comic?'依分鏡與設定卡即時組裝的繪圖提示詞。':`依分鏡、設定卡與出片平台（${plat().zh}）即時組裝。每鏡依「生成方式」給不同組合：文字生影片給一段；素材生影片先給參考圖提示詞；首尾幀給首幀、尾幀與動作。超過 ${plat().max} 秒的鏡頭會自動拆成段A、段B。`}</p>${epPicker()}
${shots.length?`<div class="toolbar"><button class="btn gold" data-act="copyAll" data-k="img">複製本${unit()}全部繪圖提示詞</button>${comic?'':`<button class="btn gold" data-act="copyAll" data-k="vid">複製本${unit()}全部影片提示詞</button><button class="btn gold" data-act="copyAll" data-k="aud">複製本${unit()}全部音軌與對白</button><button class="btn" data-act="go" data-v="shoot">進入出片模式</button>`}</div>`+
shots.map((s,i)=>{const os=outputs(s,i);return `<div class="pr"><h3>${shotLabel(s,i)}${isMV()?`　<span class="tc">${tcOf(s)}</span>`:''}　${s.size}・${s.camera}${s.technique?'・'+s.technique:''}${comic?'':'・'+METHOD[s.method]}</h3>
${os.map(o=>pbox(o.id,esc(o.label),o.text)).join('')}
${os.some(o=>o.zh)?`<details><summary>中文版</summary>${os.filter(o=>o.zh).map(o=>pbox(o.id+'z',esc(o.label)+'（中）',o.zh)).join('')}</details>`:''}</div>`;}).join('')
:`<div class="empty">這一${unit()}還沒有分鏡。<br><button class="btn gold" data-act="go" data-v="board">前往分鏡</button></div>`}`;};

R.shoot=()=>{if(!S.episodes.length)return `<h2>出片模式</h2>${noEp()}`;
const ep=curEp(),shots=sortShots(S.shots[ep.id]||[]),comic=S.project.target==='comic';shots.forEach(ensureShot);
if(!shots.length)return `<h2>出片模式</h2>${epPicker()}<div class="empty">這一${unit()}還沒有分鏡。<br><button class="btn gold" data-act="go" data-v="board">前往分鏡</button></div>`;
const k=Math.min(Math.max(0,+S.ui.shot||0),shots.length-1);S.ui.shot=k;const s=shots[k];
const ok=shots.filter(x=>x.status==='ok').length,fail=shots.filter(x=>x.status==='fail').length;
return `<h2>出片模式</h2><p class="hint">一次一${comic?'格':'鏡'}，照編號順序複製、貼到 ${comic?'繪圖工具':plat().zh}。完成後標記成功或失敗；標記失敗會直接出現一鍵重製。</p>${epPicker()}
<div class="prog"><div style="width:${Math.round(ok/shots.length*100)}%"></div></div><p class="meta" style="margin:0">成功 ${ok}／${shots.length}${fail?`，失敗 ${fail}`:''}</p>
<div class="dots">${shots.map((x,j)=>`<button class="dot ${x.status} ${j===k?'on':''}" data-act="shotGo" data-k="${j}" aria-label="第${j+1}${comic?'格':'鏡'}">${j+1}</button>`).join('')}</div>
<article class="shootcard" id="shootcard"><header><span class="no">${shotLabel(s,k)}</span>${isMV()?`<span class="tc">${tcOf(s)}</span>`:''}<span class="meta" style="margin:0">${s.size}・${s.camera}${comic?'':`・${s.duration} 秒・${METHOD[s.method]}`}</span>${s.status?`<span class="badge ${s.status}">${STATUS_ZH[s.status]}</span>`:''}</header>
<p class="shootdesc">${esc(s.visualZh)}</p>${isMV()&&s.screenText?`<p class="cardtxt">字卡（後製）：${esc(s.screenText)}</p>`:''}
${outputs(s,k).map((o,n)=>`<div class="sblock"><div class="lbl"><span>${n+1}. ${esc(o.label)}<span class="cc">${o.text.length} 字元</span></span><button class="btn gold big" data-act="copyEl" data-t="${o.id}">複製</button></div><pre id="${o.id}">${esc(o.text)}</pre></div>`).join('')}
<div class="row"><button class="btn okb ${s.status==='ok'?'on':''}" data-act="setStatus" data-v="ok" data-i="${k}">✓ 成功</button><button class="btn warn ${s.status==='fail'?'on':''}" data-act="setStatus" data-v="fail" data-i="${k}">✗ 失敗</button>${s.status?`<button class="btn" data-act="setStatus" data-v="" data-i="${k}">清除標記</button>`:''}</div>
${s.status==='fail'?fixPanel(s,k):''}
<div class="row" style="justify-content:space-between;margin-top:16px"><button class="btn" data-act="shotGo" data-k="${k-1}" ${k?'':'disabled'}>← 上一${comic?'格':'鏡'}</button><button class="btn gold" data-act="shotGo" data-k="${k+1}" ${k<shots.length-1?'':'disabled'}>下一${comic?'格':'鏡'} →</button></div></article>`;};

R.audio=()=>{if(!S.episodes.length)return `<h2>對白與聲音</h2>${noEp()}`;
const ep=curEp(),idx=S.episodes.indexOf(ep),shots=sortShots(S.shots[ep.id]||[]),a=S.audio[ep.id],mv=isMV(),T=mv?mvTimes():null;
const script=shots.map((s,i)=>s.dialogue.filter(d=>d.line).map(d=>mv?`${tcOf(s,T)}｜${shotLabel(s,i)}｜${isLyric(d)?'♪ '+d.line:`${d.who}${d.tone?`（${d.tone}）`:''}：${d.line}`}`:`${shotLabel(s,i)}｜${d.who}${d.tone?`（${d.tone}）`:''}：${d.line}`).join('\n')).filter(Boolean).join('\n');
return `<h2>${viewName('audio')}</h2><p class="hint">${mv?'MV 主歌曲（Suno 風格與歌詞）、本段歌詞對位與台詞、逐鏡音效，以及本段純音樂版提示詞。標 ♪ 的是歌詞，不做配音。':`角色聲線、整${unit()}對白腳本、逐鏡音效，以及給 SUNO 的配樂提示詞。`}</p>${epPicker()}
${mv?`<section class="sec mvsec"><div class="row" style="justify-content:space-between;margin-top:0"><h3>主歌曲《${esc(S.mv.title||'未命名')}》</h3><button class="btn sm" data-act="go" data-v="mv">到 MV 企劃編輯</button></div>
${S.mv.song.style||S.mv.lyrics?`${pbox('mvStyleA','Suno・Style of Music',S.mv.song.style)}${S.mv.song.exclude?pbox('mvExA','Suno・Exclude Styles',S.mv.song.exclude):''}${pbox('mvLyrA','Suno・Lyrics（歌詞）',S.mv.lyrics)}`:'<p class="hint">還沒有歌曲設定。先到「MV 企劃」產生歌曲與歌詞。</p>'}</section>`:''}
<section class="sec"><h3 style="margin-bottom:10px">角色聲線</h3>${S.bible.characters.length?`<div class="tblwrap"><table class="tbl"><tr><th>角色</th><th>定位</th><th>聲線設定</th></tr>${S.bible.characters.map((c,i)=>`<tr><td>${esc(c.name)}</td><td>${esc(c.role)}</td><td><input data-b="bible.characters.${i}.voice" value="${esc(c.voice)}" aria-label="聲線"></td></tr>`).join('')}</table></div>`:'<p class="hint">先在「設定卡」建立角色。</p>'}</section>
<section class="sec"><div class="row" style="justify-content:space-between"><h3>${mv?'本段純音樂版與環境音':'配樂與環境音'}</h3><button class="btn gold" data-act="aiAudio" ${shots.length?'':'disabled'}>AI 設計本${unit()}${mv?'音樂與音效':'配樂與音效'}</button></div>
${a?`${pbox('bgmSuno','SUNO 配樂提示詞',a.bgm?.suno||'')}<div class="grid2"><label>配樂情緒<input data-b="audio.${ep.id}.bgm.mood" value="${esc(a.bgm?.mood)}"></label><label>環境底音<input data-b="audio.${ep.id}.ambience" value="${esc(a.ambience)}"></label></div>
${(a.bgm?.cues||[]).length?`<div class="tblwrap" style="margin-top:12px"><table class="tbl"><tr><th>鏡頭範圍</th><th>音樂段落情緒</th></tr>${a.bgm.cues.map(c=>`<tr><td>${c.from}～${c.to}</td><td>${esc(c.mood)}</td></tr>`).join('')}</table></div>`:''}`:`<p class="hint">分鏡完成後按上方按鈕，產生配樂方向、段落與環境音。</p>`}</section>
<section class="sec"><div class="row" style="justify-content:space-between"><h3>${mv?'歌詞對位與台詞':'對白腳本'}</h3>${script?'<button class="btn sm" data-act="copyEl" data-t="scriptBox">複製腳本</button>':''}</div>${script?`<div class="pbox"><pre id="scriptBox">${esc(script)}</pre></div>`:'<p class="hint">分鏡裡還沒有對白。</p>'}</section>
<section class="sec"><h3 style="margin-bottom:10px">逐鏡音效</h3>${shots.length?`<div class="tblwrap"><table class="tbl"><tr><th>鏡頭</th><th>音效（中）</th><th>英文（音效生成用）</th></tr>${shots.map((s,i)=>{const x=(a?.sfx||[]).find(f=>+f.shot===i+1);return `<tr><td style="white-space:nowrap">${shotLabel(s,i)}</td><td><input data-b="shots.${ep.id}.${i}.sfx" value="${esc(s.sfx)}" aria-label="音效"></td><td>${esc(x?.en||'')}</td></tr>`;}).join('')}</table></div>`:'<p class="hint">還沒有分鏡。</p>'}</section>`;};

<div class="exgrid">${mvExportCards()}
<div class="ex"><h3>JSON 完整備份</h3><p>整部作品的快照（含${isMV()||mvFilled()?'MV 企劃、':''}分鏡與設定卡），可匯入成另一部新作品。</p><button class="btn gold" data-act="expJSON">存到雲端</button></div>
<div class="ex"><h3>分鏡素材表 CSV</h3><p>全部${unit()}數逐鏡清單＋提示詞，用 Google 試算表或 Excel 開，剪映對素材用。</p><button class="btn gold" data-act="expCSV">存到雲端</button></div>
<div class="ex"><h3>完整分鏡腳本 TXT</h3><p>劇情點、分鏡、對白、音效、提示詞一份讀完。</p><button class="btn gold" data-act="expTXT">存到雲端</button></div>

</div>`;

function edTbl(path,cols,add){const arr=getPath(S,path)||[];

  <button class="btn sm" data-act="addRow" data-p="${path}" data-k="${cols.map(c=>c[0]).join(',')}">＋ ${add||'新增一列'}</button>`;}

const stripHtml=h=>{const d=document.createElement('div');d.innerHTML=String(h).replace(/<\/(p|div|h\d|li)>|<br\s*\/?>/gi,'\n');return (d.textContent||'').replace(/\n{3,}/g,'\n\n').trim();};
function importWP(o){const texts=[],chars=[];
  (function walk(x,dep){if(dep>7||!x||typeof x!=='object')return;if(Array.isArray(x)){x.forEach(y=>walk(y,dep+1));return;}
    const body=x.content||x.body||x.html||x.text;
    if(typeof body==='string'&&body.length>60){texts.push(((x.title||x.name)?`【${x.title||x.name}】\n`:'')+stripHtml(body));return;}
    if(typeof x.name==='string'&&(x.appearance||x.description||x.desc||x.personality||x.role||x.identity)){chars.push({name:x.name,role:x.role||x.identity||'',zh:[x.appearance,x.description,x.desc,x.personality].filter(v=>typeof v==='string').join('；'),en:'',voice:''});}
    for(const k in x)if(x[k]&&typeof x[k]==='object')walk(x[k],dep+1);})(o,0);
  if(texts.length)S.source.text=(S.source.text?S.source.text+'\n\n':'')+texts.join('\n\n');
  let add=0;chars.forEach(c=>{if(!S.bible.characters.find(y=>y.name===c.name)){S.bible.characters.push(c);add++;}});
  if(o.title&&S.project.title==='未命名作品')S.project.title=String(o.title);
  toast(texts.length||add?`已匯入 ${texts.length} 段章節、${add} 位角色`:'這個 JSON 裡找不到章節或人物資料');
}
function handleFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const kind=inp.dataset.file;const r=new FileReader();
  r.onload=()=>{try{
    if(kind==='text'){S.source.text=(S.source.text?S.source.text+'\n\n':'')+r.result;toast(`已加入 ${f.name}`);}
    else if(kind==='wp'){importWP(JSON.parse(r.result));}
    else if(kind==='backup'){const d=JSON.parse(r.result);if(!d.project||!d.episodes)throw new Error();inp.value='';createProject((d.project.title||f.name.replace(/\.json$/i,''))+'（匯入）',d);return;}
    save();renderTop();render();
  }catch(e){toast('檔案格式不正確，無法讀取');}inp.value='';};
  r.readAsText(f,'utf-8');}

  catch(e){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast('雲端存檔失敗，改為下載到本機');setSync(CUR.id?'bad':'','雲端存檔失敗');}

expJSON:()=>download(fname('json'),JSON.stringify(S,null,1),'application/json'),
impJSON:()=>$('#backupIn').click(),
expCSV:()=>download(fname('csv'),buildCSV(),'text/csv'),
expTXT:()=>download(fname('txt'),buildTXT(),'text/plain'),
newProj:()=>{const t=($('#newTitle').value||'').trim();if(!t){toast('先輸入作品名稱');return;}createProject(t);},
openProj:el=>{if(dirty)flush();openProject(el.dataset.id);},
delProj:el=>twice(el,async()=>{const id=el.dataset.id;try{await gs('deleteProject',id);}catch(e){toast('刪除失敗');return;}
  try{localStorage.removeItem(CKEY+id)}catch(e){}PROJECTS=PROJECTS.filter(p=>p.id!==id);
  if(CUR.id===id){CUR={id:null,updated:0};S={...DEF(),ui:S.ui};S.ui.project=null;LASTJS='';setSync('','');}
  if(!PROJECTS.length)LISTSTATE='還沒有作品。輸入名稱後按「建立作品」。';saveUI();renderTop();render();toast('已移到雲端硬碟垃圾桶，30 天內可救回');}),
refreshList:()=>{LISTSTATE='讀取作品清單中…';refreshList();},
useRemote:()=>{if(!LC)return;applyData(JSON.parse(LC.remote));CUR.updated=LC.updated;LASTJS=JSON.stringify(dataOf());dirty=false;cacheLocal(false);closeModal();renderTop();render();setSync('ok','已同步 '+hhmm(LC.updated));toast('已載入雲端版本');},
forceMine:()=>{closeModal();dirty=true;flush(true);},
closeModal:()=>{ctl?.abort();closeModal();},
stopAI:()=>ctl?.abort(),
toManual:()=>{ctl?.abort();setTimeout(()=>showManual(),50);},
retryAI:()=>{S.ui.ai='auto';save();renderTop();runAI(pending.title,pending.prompt,pending.apply,pending.task);},
copyPrompt:()=>copyText(pending.prompt),
applyManual:()=>{try{pending.apply(parseJSON($('#mPaste').value));save();closeModal();render();toast('已套用結果');}catch(e){toast('無法解析，請確認貼上的是完整 JSON');}}
};

/* ========== 事件 ========== */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el);}});
document.addEventListener('input',e=>{const t=e.target,b=t.dataset&&t.dataset.b;if(!b)return;let v=t.value;
  if(t.type==='number'||t.dataset.num!==undefined)v=Number(v)||0;
  if(t.dataset.list!==undefined)v=v.split(/[、,，]/).map(x=>x.trim()).filter(Boolean);
  setPath(S,b,v);save();
  if(b==='source.text'){const c=$('#cnt');if(c)c.textContent=v.length.toLocaleString();}
  if(b==='project.title')renderTop();
  if(b.startsWith('shots.')){const p=b.split('.');refreshDiff(p[1],+p[2]);}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.file){handleFile(t);return;}if(t.id==='engSel'&&false){S.ui.ai=t.value;save();renderTop();return;}if(t.id==='tierSel'){S.ui.tier=t.value;save();toast(t.value==='task'?'依任務自動配等級：拆解／分鏡深度、設定卡／配樂標準、單鏡修改快速':`之後全部使用${TIER_ZH[t.value]}等級`);return;}if(t.id==='engSel'){S.ui.engine=t.value;save();return;}if(t.dataset.rr!==undefined){render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)A.closeModal();});
$('#themeBtn').onclick=()=>{const r=document.documentElement;const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');r.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem(KEY+'-theme',r.dataset.theme)}catch(e){}};
try{const th=localStorage.getItem(KEY+'-theme');document.documentElement.dataset.theme=th||'dark';}catch(e){document.documentElement.dataset.theme='dark';}

document.addEventListener('visibilitychange',async()=>{
  if(!HAS_GAS||!CUR.id)return;
  if(document.visibilityState==='hidden'){if(dirty)flush();return;}
  if(dirty||saving)return;
  try{const m=await gs('getProjectMeta',CUR.id);if(m&&m.updated>CUR.updated){const r=await gs('loadProject',CUR.id);applyData(JSON.parse(r.content));CUR.updated=r.updated;LASTJS=JSON.stringify(dataOf());cacheLocal(false);renderTop();render();setSync('ok','已同步 '+hhmm(r.updated));toast('已載入其他裝置的最新修改');}}catch(e){}
});
window.addEventListener('beforeunload',e=>{if(dirty){cacheLocal(true);}});
(async function init(){
  renderTop();render();
  if(!HAS_GAS){setSync('bad','本機預覽');await refreshList();return;}
  await refreshList();
  const last=S.ui.project;
  if(last&&PROJECTS.find(p=>p.id===last))await openProject(last);
  else{S.ui.view='projects';setSync('','請選擇作品');render();}
})();
</script>
</body>
</html>
